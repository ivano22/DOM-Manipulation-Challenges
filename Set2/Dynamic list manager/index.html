<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic list Manager</title>
    <style>
        body{
            
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
           }
           div{
            margin-top: 100px;
           }
           input{
            padding: 10px;
            width:20%;
            display:inline-block;
            margin-right: 10px;
            border: 2px solid green;
           }
           button{
            color: white;
            background-color: rgba(29, 141, 12, 0.847);
            cursor: pointer;
            padding: 10px;
            width: 10%;
            border:1px solid white;
            border-radius: 10px;
           }
           .listItem{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background-color: #f9f9f9;
            text-align: center;
            width: 90%;
           }
           .edit-buttons {
            
            margin-left: 5px;
            padding: 5px 10px;
        }
           .edit-button {
            background-color: #2196F3;
             margin-left:70%;
        }
        .delete-button{
        
            background-color: #f44336;
        
        }
    </style>
</head>
<body>
    <h1>Dynamic List Manager</h1>

    <div>
        <input type="text" name="insert-text" id="insert-text" placeholder="Enter Item">
        <button id="add-item">Add Item</button>
    </div>
    <div >
        <ul id="list-item" > <!-- placeholder for the list items. --> </ul>
       

    </div>

    <script src="./index.js"></script>
</body>
</html>

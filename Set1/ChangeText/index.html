<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Text</title>
    <style>
        h2{
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
            font-family: Arial, sans-serif;
            
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        
        .text-block {
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-height: 100px;
            min-width: 80%;
        }
        label{
           
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <h2>Change Text Style with Javascript</h2>

    <div class="container">
      <div class="controls">
        <label for="">Font-Family</label>  
          <select id="fontFamily">
              <option value="Arial">Arial</option>
              <option value="Times New Roman">Times New Roman</option>
              <option value="Courier New">Courier New</option>
              <option value="Georgia">Georgia</option>
              <option value="Verdana">Verdana</option>
          </select>
          <label for="Font Size">Font Size</label>
          <select id="fontSize">
              <option value="12px">12px</option>
              <option value="14px">14px</option>
              <option value="16px" selected>16px</option>
              <option value="18px">18px</option>
              <option value="20px">20px</option>
              <option value="24px">24px</option>
              <option value="32px">32px</option>
          </select>
           <label for="">Text Color</label>

          <select id="textColor">
              <option value="black">Black</option>
              <option value="white">White</option>
              <option value="blue">Blue</option>
              <option value="red">Red</option>
              <option value="green">Green</option>
              <option value="purple">Purple</option>
          </select>
          <label for="">Background color</label>
          <select id="backgroundColor">
            <option value="#fff">White</option>
            <option value="black">Dark</option>
            <option value="Orange">Orange</option>
            <option value="lightgreen">light-green</option>
            
        </select>
      </div>
      
      <div id="textBlock" class="text-block">
          Lorem ipsum dolor sit amet, consectetur adipiscing elit. 
          Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo  
      </div>
  </div>
    <script src="./index.js"></script>
</body>
</html>

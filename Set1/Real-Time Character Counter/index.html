<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Character Counter</title>
    <style>
        h2{
            text-align: center;
            margin-bottom: 5rem;
        }
        .container {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
        }
        
        .textarea-wrapper {
            position: relative;
            margin-bottom: 10px;
        }
        
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-size: 16px;
        }
        
        #counter {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
            color: #666;
        }
        
        .warning {
            color: #d32f2f;
        }
    </style>
</head>
<body>
    <h2>Real-Time Character Counter</h2>
    <div class="container">
        <div class="textarea-wrapper">
            <textarea id="message" maxlength="200" placeholder="Type your message here..."></textarea>
            <div id="counter">200 characters remaining</div>
        </div>
    </div>


    <script src="./index.js"></script>
</body>
</html>

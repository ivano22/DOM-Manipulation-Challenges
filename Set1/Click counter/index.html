<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Counter</title>
    <style>
        body {
             text-align: center;
        }
        button {
           
           margin-top:10rem ; 
           padding: 1rem 2rem;
            font-size: 1.2rem;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #0c8210;
            color: white;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: orangered;
        }
    </style>
</head>
<body>
    <h2>Click Counter</h2>
    
    <button id="counterButton">Clicks: 0</button>
    <script src="./index.js"></script>
</body>
</html>
